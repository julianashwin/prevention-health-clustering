[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
prevention_health_clustering = ["models/stan/*.stan", "models/stan/*.stanfunctions"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prevention_health_clustering*"]

[project]
name = "prevention-health-clustering"
version = "0.1.0"
description = "Bayesian latent-class health trajectory models for UKHLS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "cmdstanpy>=1.2",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
phc = "prevention_health_clustering.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
